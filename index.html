<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Content Security Policy: the page trusts no third party. Videos and our own
       JS/CSS only; Google Fonts is the sole whitelisted remote resource. This nulls
       scripts/embeds/frames from anywhere else (including any TikTok embed script
       being injected) — a static one-page feed with no back end is already the most
       attack-surface-free architecture a site can have; this policy hardens it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self'; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="A vertical video feed.">
  <title>videos</title>
  <!-- Deployment note: when hosting, serve over HTTPS and apply the headers in
       `_headers` (Netlify/Cloudflare Pages compatible) so `frame-ancestors 'none'`
       and friends are enforced — a meta tag cannot express frame-ancestors, so the
       file bundles that protection for the hosted version. For local preview, run
       `npx serve` (or `python -m http.server`) instead of double-clicking the file. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-shell">
    <section class="content" id="content" aria-label="Video feed">
      <div class="video-feed" id="videoFeed">
        <!-- Add your downloaded/owned MP4 files to the videos folder using these names. -->
        <article class="feed-video">
          <video class="feed-player" src="videos/video-1.mp4" autoplay playsinline loop preload="auto"></video>
          <p class="video-missing">Add <strong>videos/video-1.mp4</strong> to play this video.</p>
          <p class="audio-hint" id="audioHint">click anywhere for sound</p>
          <div class="scroll-hint" aria-hidden="true"><span>swipe up</span><b>&#8595;</b></div>
        </article>
        <article class="feed-video">
          <video class="feed-player" src="videos/video-2.mp4" playsinline loop preload="metadata"></video>
          <p class="video-missing">Add <strong>videos/video-2.mp4</strong> to play this video.</p>
        </article>
        <article class="feed-video">
          <video class="feed-player" src="videos/video-3.mp4" playsinline loop preload="metadata"></video>
          <p class="video-missing">Add <strong>videos/video-3.mp4</strong> to play this video.</p>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
